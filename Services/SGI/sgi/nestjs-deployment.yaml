apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-app
spec:
  replicas: 2  # Número de pods
  selector:
    matchLabels:
      app: nestjs
  template:
    metadata:
      labels:
        app: nestjs
    spec:
      containers:
        - name: nestjs-container
          image: lewisguerredodev/nestjs-setup:latest  # Imagen desde Docker Hub
          imagePullPolicy: Always  # Kubernetes siempre obtiene la última versión
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nestjs-service
spec:
  selector:
    app: nestjs
  ports:
    - protocol: TCP
      port: 80  # Puerto externo
      targetPort: 3000  # Puerto interno del contenedor
  type: NodePort  # Exposición en Minikube
